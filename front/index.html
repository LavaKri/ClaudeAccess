<!DOCTYPE HTML>
<head>
<meta charset="UTF-8"/>
<title data-i18n="app.title">Claude Code</title>
</head><body>
<p><a href="options.html" data-i18n="link.options">Options</a></p>
<section id="workflowArea" aria-labelledby="workflowAreaH2">
<h2 id="workflowAreaH2" data-i18n="heading.workspace">Espace de travail</h2>
<ul id="workspaceList"></ul>
<button type="button" id="addWorkspaceButton" data-i18n="button.addWorkspace">Ajouter un espace de travail...</button>
</section>
<section id="sessionsArea" aria-labelledby="sessionsAreaH2">
<h2 id="sessionsAreaH2" data-i18n="heading.sessions">Sessions</h2>
<button type="button" id="newSessionButton" data-i18n="button.newSession">Nouvelle session</button>
<button type="button" id="refreshSessionsButton" data-i18n="button.refreshSessions">Rafraîchir les sessions</button>
<ul id="sessionList"></ul>
<button type="button" id="newerSessionsButton" data-i18n="button.newerSessions">Sessions plus récentes</button>
<button type="button" id="olderSessionsButton" data-i18n="button.olderSessions">Sessions plus anciennes</button>
</section>
<h1 id="sessionTitle" data-i18n="session.defaultTitle">Claude code</h1>
<div id="statusArea" role="status" aria-live="polite">
</div>
<div id="sessionOptionsArea">
</div>
<div id="tokenUsageArea">
</div>
<section id="messageArea" aria-label="Messages" data-i18n-attr="aria-label:aria.messages">
</section>
<div id="paginationArea" role="group" aria-label="Pagination des messages" data-i18n-attr="aria-label:aria.pagination">
<button type="button" id="firstPageButton" data-i18n="button.firstPage">Première page</button>
<button type="button" id="prevPageButton" data-i18n="button.prevPage">Page précédente</button>
<label for="pageInput" data-i18n="label.page">Page </label>
<input type="number" id="pageInput" min="1" value="1" size="4">
<span id="totalPagesLabel">sur 1</span>
<button type="button" id="nextPageButton" data-i18n="button.nextPage">Page suivante</button>
<button type="button" id="lastPageButton" data-i18n="button.lastPage">Dernière page</button>
</div>
<dialog id="questionArea">
</dialog>
<section id="promptArea" aria-labelledby="promptAreaH2">
<h2 id="promptAreaH2" data-i18n="heading.prompt">Prompt</h2>
<form id="promptForm">
<label for="prompt" data-i18n="label.prompt">Prompt: </label>
<textarea id="prompt" name="prompt" rows="10" cols="100"></textarea>
<button type="submit" id="sendButton" data-i18n="button.send">Send</button>
<button type="button" id="abortButton" disabled data-i18n="button.abort">Abort</button>
<div id="optionsArea">
<label for="modelSelect" data-i18n="label.model">Modèle: </label>
<select id="modelSelect" name="model"></select>
<label for="effortSelect" data-i18n="label.effort">Effort: </label>
<select id="effortSelect" name="effort"></select>
<label for="permissionModeSelect" data-i18n="label.permissionMode">Mode de permission: </label>
<select id="permissionModeSelect" name="permissionMode"></select>
</div>
</form>
</div>
<script type="module" src="index.js"></script>
</body></html>
