<!DOCTYPE HTML>
<head>
<meta charset="UTF-8"/>
<title>Claude Code</title>
</head><body>
<section id="workflowArea" aria-labelledby="workflowAreaH2">
<h2 id="workflowAreaH2">Espace de travail</h2>
<ul id="workspaceList"></ul>
<button type="button" id="addWorkspaceButton">Ajouter un espace de travail...</button>
</section>
<section id="sessionsArea" aria-labelledby="sessionsAreaH2">
<h2 id="sessionsAreaH2">Sessions</h2>
<button type="button" id="newSessionButton">Nouvelle session</button>
<button type="button" id="refreshSessionsButton">Rafraîchir les sessions</button>
<ul id="sessionList"></ul>
<button type="button" id="newerSessionsButton">Sessions plus récentes</button>
<button type="button" id="olderSessionsButton">Sessions plus anciennes</button>
</section>
<h1 id="sessionTitle">Claude code</h1>
<div id="statusArea" role="status" aria-live="polite">
</div>
<div id="sessionOptionsArea">
</div>
<div id="tokenUsageArea">
</div>
<section id="messageArea" aria-label="Messages">
</section>
<div id="paginationArea" role="group" aria-label="Pagination des messages">
<button type="button" id="firstPageButton">Première page</button>
<button type="button" id="prevPageButton">Page précédente</button>
<label for="pageInput">Page </label>
<input type="number" id="pageInput" min="1" value="1" size="4">
<span id="totalPagesLabel">sur 1</span>
<button type="button" id="nextPageButton">Page suivante</button>
<button type="button" id="lastPageButton">Dernière page</button>
</div>
<dialog id="questionArea">
</dialog>
<section id="promptArea" aria-labelledby="promptAreaH2">
<h2 id="promptAreaH2">Prompt</h2>
<form id="promptForm">
<label for="prompt">Prompt: </label>
<textarea id="prompt" name="prompt" rows="10" cols="100"></textarea>
<button type="submit" id="sendButton">Send</button>
<button type="button" id="abortButton" disabled>Abort</button>
<div id="optionsArea">
<label for="modelSelect">Modèle: </label>
<select id="modelSelect" name="model">
<option value="sonnet" selected>Sonnet</option>
<option value="opus">Opus</option>
<option value="haiku">Haiku</option>
</select>
<label for="effortSelect">Effort: </label>
<select id="effortSelect" name="effort">
<option value="low" selected>Faible</option>
<option value="medium">Moyen</option>
<option value="high">Élevé</option>
</select>
<label for="permissionModeSelect">Mode de permission: </label>
<select id="permissionModeSelect" name="permissionMode">
<option value="default" selected>Par défaut</option>
<option value="acceptEdits">Accepter les modifications</option>
<option value="plan">Plan</option>
<option value="bypassPermissions">Ignorer les permissions</option>
</select>
</div>
</form>
</div>
<script type="module" src="index.js"></script>
</body></html>
