<!DOCTYPE HTML>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">ClaudeAccess</title>
<link rel="stylesheet" href="style.css">
</head><body>
<p id="optionsLinkArea" class="app-header"><a href="options.html" data-i18n="link.options">Options</a></p>
<section id="workflowArea" class="app-sidebar" aria-labelledby="workflowAreaH2">
<h2 id="workflowAreaH2" data-i18n="heading.workspace">Workspace</h2>
<ul id="workspaceList"></ul>
<button type="button" id="newerWorkspacesButton" data-i18n="button.newerWorkspaces">Newer workspaces</button>
<button type="button" id="olderWorkspacesButton" data-i18n="button.olderWorkspaces">Older workspaces</button>
<button type="button" id="showHiddenWorkspacesButton" aria-pressed="false" data-i18n="button.showHiddenWorkspaces">Show hidden workspaces</button>
<button type="button" id="addWorkspaceButton" data-i18n="button.addWorkspace">Add a workspace...</button>
</section>
<section id="sessionsArea" class="app-sidebar" aria-labelledby="sessionsAreaH2">
<h2 id="sessionsAreaH2" data-i18n="heading.sessions">Sessions</h2>
<button type="button" id="newSessionButton" data-i18n="button.newSession">New session</button>
<button type="button" id="refreshSessionsButton" data-i18n="button.refreshSessions">Refresh sessions</button>
<ul id="sessionList"></ul>
<button type="button" id="newerSessionsButton" data-i18n="button.newerSessions">Newer sessions</button>
<button type="button" id="olderSessionsButton" data-i18n="button.olderSessions">Older sessions</button>
</section>
<h1 id="sessionTitle" class="app-main" data-i18n="session.defaultTitle">ClaudeAccess</h1>
<div id="statusArea" class="app-main" role="status" aria-live="polite">
</div>
<div id="sessionOptionsArea" class="app-main">
</div>
<div id="tokenUsageArea" class="app-main">
</div>
<section id="messageArea" class="app-main" aria-label="Messages" data-i18n-attr="aria-label:aria.messages">
</section>
<div id="paginationArea" class="app-main" role="group" aria-label="Message pagination" data-i18n-attr="aria-label:aria.pagination" hidden>
<button type="button" id="prevPageButton" data-i18n="button.prevPage">Previous page</button>
<span id="pageButtons"></span>
<button type="button" id="nextPageButton" data-i18n="button.nextPage">Next page</button>
<button type="button" id="goToPageButton" data-i18n="button.goToPage">Go to page...</button>
</div>
<dialog id="questionArea">
</dialog>
<section id="promptArea" class="app-main app-prompt" aria-labelledby="promptAreaH2">
<h2 id="promptAreaH2" data-i18n="heading.prompt">Prompt</h2>
<p id="processStatus" role="status" aria-live="polite" aria-atomic="true"></p>
<form id="promptForm">
<label for="prompt" data-i18n="label.prompt">Prompt: </label>
<textarea id="prompt" name="prompt" rows="10" cols="100"></textarea>
<button type="submit" id="sendButton" data-i18n="button.send">Send</button>
<button type="button" id="abortButton" disabled data-i18n="button.abort">Abort</button>
<button type="button" id="addAttachmentsButton" data-i18n="button.addAttachments">Add attachments...</button>
<input type="file" id="attachmentInput" multiple hidden>
<ul id="attachmentList" aria-label="Attachments" data-i18n-attr="aria-label:aria.attachments" hidden></ul>
<div id="optionsArea">
<label for="modelSelect" data-i18n="label.model">Model: </label>
<select id="modelSelect" name="model"></select>
<label for="effortSelect" data-i18n="label.effort">Effort: </label>
<select id="effortSelect" name="effort"></select>
<label for="permissionModeSelect" data-i18n="label.permissionMode">Permission mode: </label>
<select id="permissionModeSelect" name="permissionMode"></select>
</div>
</form>
</section>
<footer class="app-footer"><p data-i18n="app.versionFooter">ClaudeAccess</p></footer>
<script type="module" src="index.js"></script>
</body></html>
