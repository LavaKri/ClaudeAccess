<!DOCTYPE HTML>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">ClaudeAccess</title>
<link rel="stylesheet" href="style.css">
</head><body>
<p id="optionsLinkArea" class="app-header"><a href="options.html" data-i18n="link.options">Options</a></p>
<div id="optionsArea" class="app-header" role="group" aria-label="Run options" data-i18n-attr="aria-label:aria.runOptions">
<label for="modelSelect" data-i18n="label.model">Model: </label>
<select id="modelSelect" name="model"></select>
<label for="effortSelect" data-i18n="label.effort">Effort: </label>
<select id="effortSelect" name="effort"></select>
<label for="permissionModeSelect" data-i18n="label.permissionMode">Permission mode: </label>
<select id="permissionModeSelect" name="permissionMode" aria-describedby="permissionModeDescription permissionModeChanges"></select>
<p id="permissionModeDescription"></p>
<p id="permissionModeChanges" hidden></p>
</div>
<section id="workspaceArea" class="app-sidebar" aria-labelledby="workspaceAreaH2">
<h2 id="workspaceAreaH2" data-i18n="heading.workspace">Workspace</h2>
<ul id="workspaceList"></ul>
<button type="button" id="newerWorkspacesButton" data-i18n="button.newerWorkspaces">Newer workspaces</button>
<button type="button" id="olderWorkspacesButton" data-i18n="button.olderWorkspaces">Older workspaces</button>
<button type="button" id="addWorkspaceButton" data-i18n="button.addWorkspace">Add a workspace...</button>
<button type="button" id="existingWorkspacesButton" data-i18n="button.existingWorkspaces">Existing workspaces...</button>
</section>
<section id="sessionsArea" class="app-sidebar" aria-labelledby="sessionsAreaH2">
<h1 id="sessionsAreaH2" data-i18n="heading.sessions">Sessions</h1>
<button type="button" id="newSessionButton" data-i18n="button.newSession">New session</button>
<button type="button" id="refreshSessionsButton" data-i18n="button.refreshSessions">Refresh sessions</button>
<ul id="sessionList"></ul>
<button type="button" id="newerSessionsButton" data-i18n="button.newerSessions">Newer sessions</button>
<button type="button" id="olderSessionsButton" data-i18n="button.olderSessions">Older sessions</button>
</section>
<h2 id="sessionTitle" class="app-main" data-i18n="session.defaultTitle">ClaudeAccess</h2>
<div id="statusArea" class="app-main" role="status" aria-live="polite">
</div>
<div id="sessionOptionsArea" class="app-main">
</div>
<div id="tokenUsageArea" class="app-main">
</div>
<div id="paginationArea" class="app-main" role="group" aria-label="Message pagination" data-i18n-attr="aria-label:aria.pagination">
<button type="button" id="firstPageButton" data-i18n="button.firstPage">First page</button>
<button type="button" id="prevPageButton" data-i18n="button.prevPage">Previous page (Alt+Page Up)</button>
<label for="pageInput" data-i18n="label.page">Page </label>
<select id="pageInput"><option value="1">1</option></select>
<span id="totalPagesLabel">of 1</span>
<button type="button" id="nextPageButton" data-i18n="button.nextPage">Next page (Alt+Page Down)</button>
<button type="button" id="lastPageButton" data-i18n="button.lastPage">Last page</button>
</div>
<section id="messageArea" class="app-main" aria-label="Messages" data-i18n-attr="aria-label:aria.messages">
</section>
<dialog id="questionArea">
</dialog>
<section id="promptArea" class="app-main app-prompt" aria-label="Prompt" data-i18n-attr="aria-label:heading.prompt" tabindex="-1">
<form id="promptForm">
<label for="prompt" data-i18n="label.prompt">Prompt: </label>
<textarea id="prompt" name="prompt" rows="10" cols="100"></textarea>
<button type="submit" id="sendButton" data-i18n="button.send">Send (Ctrl+Enter)</button>
<button type="submit" id="sendLowEffortButton" data-i18n="button.sendLowEffort">Send with low effort (Shift+Enter)</button>
<button type="submit" id="sendBranchButton" data-i18n="button.sendBranch">Send to a new branch</button>
<button type="button" id="abortButton" disabled data-i18n="button.abort">Abort</button>
</form>
</section>
<div id="progressArea" class="app-main">
<p id="progressLine" tabindex="-1"></p>
</div>
<script type="module" src="index.js"></script>
</body></html>
