<!DOCTYPE HTML>
<head>
<meta charset="UTF-8"/>
<title>Claude Code Testing</title>
</head><body>
<h1 id="sessionTitle">Claude code Testing</h1>
<div id="workflowArea">
<form id="cwdForm">
<label for="cwd">Répertoire de travail: </label>
<input type="text" id="cwd" name="cwd" list="recentProjects" size="60">
<datalist id="recentProjects"></datalist>
<button type="submit">Changer</button>
</form>
<button type="button" id="newSessionButton">Nouvelle session</button>
<button type="button" id="refreshSessionsButton">Rafraîchir les sessions</button>
<ul id="sessionList"></ul>
</div>
<div id="statusArea" role="status" aria-live="polite">
</div>
<div id="messageArea" role="log" aria-live="off">
</div>
<div id="questionArea" style="display:none">
</div>
<div id="promptArea">
<form id="promptForm">
<label for="prompt">Prompt: </label>
<textarea id="prompt" name="prompt" rows="10" cols="100"></textarea>
<button type="submit" id="sendButton">Send</button>
<button type="button" id="abortButton" disabled>Abort</button>
</form>
</div>
<script type="module" src="index.js"></script>
</body></html>
