<!DOCTYPE HTML>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="options.pageTitle">Application options</title>
<link rel="stylesheet" href="style.css">
</head><body class="options-page">
<p><a href="index.html" data-i18n="link.backToApp">Back to the app</a></p>
<h1 data-i18n="options.heading">Application options</h1>
<div id="optionsStatusArea" role="status" aria-live="polite"></div>
<form id="optionsForm">
<section aria-labelledby="generalOptionsH2">
<h2 id="generalOptionsH2" data-i18n="heading.generalOptions">General</h2>
<label for="languageSelect" data-i18n="label.language">Language: </label>
<select id="languageSelect" name="language"></select>
</section>
<section aria-labelledby="appearanceOptionsH2">
<h2 id="appearanceOptionsH2" data-i18n="heading.appearanceOptions">Appearance and usability</h2>
<label for="themeSelect" data-i18n="label.theme">Theme: </label>
<select id="themeSelect" name="theme"></select>
<label for="messagesPerPageInput" data-i18n="label.messagesPerPage">Messages per page: </label>
<input type="number" id="messagesPerPageInput" name="messagesPerPage" min="1">
<label for="sessionsPerPageInput" data-i18n="label.sessionsPerPage">Sessions per page: </label>
<input type="number" id="sessionsPerPageInput" name="sessionsPerPage" min="1">
<label for="titlePreviewWordCountInput" data-i18n="label.titlePreviewWordCount">Word count for replies' title preview: </label>
<input type="number" id="titlePreviewWordCountInput" name="titlePreviewWordCount" min="1">
<label for="completionSoundInput"><input type="checkbox" id="completionSoundInput" name="completionSound"> <span data-i18n="label.completionSound">Sound when a response finishes</span></label>
<label for="progressAnnounceInput"><input type="checkbox" id="progressAnnounceInput" name="progressAnnounce"> <span data-i18n="label.progressAnnounce">Announce progress steps with the screen reader</span></label>
</section>
<section aria-labelledby="defaultRunOptionsH2">
<h2 id="defaultRunOptionsH2" data-i18n="heading.defaultRunOptions">Defaults for new sessions</h2>
<label for="defaultModelSelect" data-i18n="label.model">Model: </label>
<select id="defaultModelSelect" name="defaultModel"></select>
<label for="defaultEffortSelect" data-i18n="label.effort">Effort: </label>
<select id="defaultEffortSelect" name="defaultEffort"></select>
<label for="defaultPermissionModeSelect" data-i18n="label.permissionMode">Permission mode: </label>
<select id="defaultPermissionModeSelect" name="defaultPermissionMode"></select>
</section>
<section aria-labelledby="advancedOptionsH2">
<h2 id="advancedOptionsH2" data-i18n="heading.advancedOptions">Advanced settings</h2>
<label for="hostInput" data-i18n="label.host">Server listen host: </label>
<input type="text" id="hostInput" name="host" size="20">
<label for="portInput" data-i18n="label.port">Server listen port: </label>
<input type="number" id="portInput" name="port" min="1" max="65535">
<label for="cliCommandInput" data-i18n="label.cliCommand">Command to invoke the Claude Code CLI: </label>
<input type="text" id="cliCommandInput" name="cliCommand" size="70">
<label for="claudeHomeDirInput" data-i18n="label.claudeHomeDir">Claude Code sessions storage directory: </label>
<input type="text" id="claudeHomeDirInput" name="claudeHomeDir" size="70">
</section>
<button type="submit" id="saveOptionsButton" data-i18n="button.save">Save</button>
<button type="button" id="resetOptionsButton" data-i18n="button.reset">Reset</button>
<button type="button" id="backButton" data-i18n="button.back">Back</button>
</form>
<script type="module" src="options.js"></script>
</body></html>
